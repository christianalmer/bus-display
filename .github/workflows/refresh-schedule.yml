name: refresh-schedule

on:
  schedule:
    - cron: "17 11 * * 1"  # Mondays 11:17 UTC (~4am Pacific)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate schedule from Muni GTFS
        env:
          API_KEY_511: ${{ secrets.API_KEY_511 }}
        run: python3 tools/gen_schedule.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bus_display/schedule.h schedule.json
          if git diff --cached --quiet; then
            echo "schedule unchanged"
          else
            git commit -m "Refresh Muni schedule (automated)"
            git push
          fi
